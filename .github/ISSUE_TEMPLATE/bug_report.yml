name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: input
    id: gnome-shell
    attributes:
      label: GNOME Shell version
      description: The output of `gnome-shell --version`.
      placeholder: GNOME Shell 50.1
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution
      placeholder: Ubuntu 26.04 LTS
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session
      options:
        - Ubuntu
        - GNOME
        - Other
  - type: input
    id: version
    attributes:
      label: Extension version
      description: As shown in Extensions or Extension Manager.
      placeholder: "1.0"
  - type: textarea
    id: extensions
    attributes:
      label: Other enabled extensions
      description: The output of `gnome-extensions list --enabled`.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The output of `journalctl -b -o cat /usr/bin/gnome-shell | grep -A10 dnd-in-calendar`.
      render: text
